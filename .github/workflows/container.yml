name: Сборка контейнера Git Support

on:
  push:
    branches:
      - '**'
    tags:
      - 'check-image-*'
      - 'build-image-*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Подготовить токенизатор BGE-M3 для тестов
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen

          url = 'https://huggingface.co/BAAI/bge-m3/resolve/5617a9f61b028005a4858fdac845db406aefb181/tokenizer.json'
          expected = '21106b6d7dab2952c1d496fb21d5dc9db75c28ed361a05f5020bbba27810dd08'
          with urlopen(url, timeout=120) as response:
              data = response.read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise ValueError(f'Контрольная сумма токенизатора не совпала: {actual}')
          target = Path('data/tokenizers/bge-m3-tokenizer.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          PY
      - name: Выполнить тесты
        run: python -m unittest discover -s tests
      - name: Определить SHA собранного коммита
        id: revision
        shell: bash
        run: |
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Некорректный SHA коммита" >&2
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
      - name: Собрать Linux amd64 образ
        run: docker build --platform linux/amd64 -t git-support-check .
      - name: Проверить запуск и использование памяти
        run: |
          docker volume create git-support-check-data
          docker run -d --name git-support-check --memory 256m --cpus 0.5 --pids-limit 64 -v git-support-check-data:/app/data -p 127.0.0.1:18025:8025 git-support-check
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18025/health; then break; fi
            if [ "$i" = 45 ]; then docker logs git-support-check; exit 1; fi
            sleep 1
          done
          docker stats --no-stream git-support-check
          echo "Память показана для пустой базы при запуске; под нагрузкой требуется отдельное измерение."
          docker exec git-support-check python -c "from pathlib import Path; Path('/app/data/persistence-check').write_text('ok')"
          docker rm -f git-support-check
          docker run --rm -v git-support-check-data:/app/data --entrypoint python git-support-check -c "from pathlib import Path; assert Path('/app/data/persistence-check').read_text() == 'ok'; assert Path('/app/data/app.sqlite3').exists(); assert Path('/app/data/tokenizers/bge-m3-tokenizer.json').exists()"
      - name: Сохранить проверенный образ
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/build-image-'))
        run: docker save git-support-check -o image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/build-image-'))
        with:
          name: checked-image
          path: image.tar
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/build-image-'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checked-image
      - name: Загрузить проверенный образ
        run: docker load -i image.tar
      - name: Войти в GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Опубликовать образ с SHA
        env:
          IMAGE: ghcr.io/alexisshvili24-lgtm/codex.lesson06/git-support
          COMMIT: ${{ needs.build.outputs.sha }}
        run: |
          docker tag git-support-check "$IMAGE:$COMMIT"
          docker push "$IMAGE:$COMMIT"
          echo "Образ: $IMAGE:$COMMIT" >> "$GITHUB_STEP_SUMMARY"
